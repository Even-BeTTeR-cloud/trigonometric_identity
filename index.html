<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼각함수 덧셈정리 알아가기</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

  :root {
    --bg: #fafaf8;
    --panel: #ffffff;
    --border: #e0ddd6;
    --blue: #2563eb;
    --orange: #d97706;
    --red: #dc2626;
    --green: #16a34a;
    --gold: #b45309;
    --gray-line: #9ca3af;
    --text: #1a1a1a;
    --muted: #6b7280;
    --shadow: rgba(0,0,0,0.07);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Serif KR', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    padding: 14px 28px;
    background: var(--panel);
    border-bottom: 2px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    box-shadow: 0 1px 4px var(--shadow);
  }
  header h1 { font-size: 1.08rem; font-weight: 700; }
  .badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    background: #eff6ff;
    color: var(--blue);
    border: 1px solid #bfdbfe;
    border-radius: 4px;
    padding: 3px 9px;
  }

  .main {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 560px;
    padding: 20px 20px 0;
    align-items: center;
    gap: 16px;
  }

  .canvas-wrap {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  canvas {
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    display: block;
    max-width: 100%;
    box-shadow: 0 2px 12px var(--shadow);
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    font-family: 'JetBrains Mono', monospace;
    color: var(--muted);
  }
  .leg-line { width: 24px; height: 3px; border-radius: 2px; }

  .toggle-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .toggle-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: white;
    color: var(--muted);
    cursor: pointer;
    transition: all .2s;
  }
  .toggle-btn.on {
    border-color: var(--blue);
    background: #eff6ff;
    color: var(--blue);
  }

  .card {
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 15px;
    box-shadow: 0 1px 6px var(--shadow);
  }
  .card-title {
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.4px;
    color: var(--muted);
    margin-bottom: 11px;
  }

  .slider-item { display:flex; flex-direction:column; gap:6px; margin-bottom:11px; }
  .slider-item:last-child { margin-bottom:0; }
  .slider-lbl { display:flex; justify-content:space-between; align-items:center; }
  .slider-name { font-family:'JetBrains Mono',monospace; font-size:.88rem; font-weight:600; }
  .slider-num  { font-family:'JetBrains Mono',monospace; font-size:.75rem; color:var(--muted); }

  input[type=range] {
    width:100%; height:4px;
    -webkit-appearance:none; appearance:none;
    border-radius:2px; outline:none; cursor:pointer;
  }
  input[type=range].rx {
    background:linear-gradient(to right, var(--blue) 0%, var(--blue) var(--pct,50%), #dbeafe var(--pct,50%), #dbeafe 100%);
  }
  input[type=range].ry {
    background:linear-gradient(to right, var(--orange) 0%, var(--orange) var(--pct,50%), #fef3c7 var(--pct,50%), #fef3c7 100%);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:15px; height:15px;
    border-radius:50%; border:2px solid #fff; cursor:pointer;
    box-shadow:0 1px 4px rgba(0,0,0,0.2);
  }
  input[type=range].rx::-webkit-slider-thumb { background:var(--blue); }
  input[type=range].ry::-webkit-slider-thumb { background:var(--orange); }

  footer {
    width:100%; text-align:center;
    padding:16px; font-size:.65rem; color:var(--muted);
    margin-top:20px;
  }
</style>
</head>
<body>

<header>
  <h1>삼각함수 덧셈정리 알아가기</h1>
  <span class="badge">직각삼각형 구성 탐구</span>
</header>

<div class="main">
  <div class="canvas-wrap">
    <canvas id="cvs" width="500" height="560"></canvas>

    <div class="legend">
      <div class="legend-item"><div class="leg-line" style="background:#dc2626;height:4px"></div>DE ← 핵심변</div>
      <div class="legend-item"><div class="leg-line" style="background:#2563eb;height:4px"></div>AB ← 핵심변</div>
      <div class="legend-item"><div class="leg-line" style="background:#16a34a;height:4px"></div>EC ← 핵심변</div>
      <div class="legend-item"><div class="leg-line" style="background:#9ca3af"></div>기타 변</div>
    </div>

    <div class="toggle-row">
      <button class="toggle-btn on" id="btn-labels" onclick="tog('labels')">점 이름</button>
      <button class="toggle-btn on" id="btn-angles" onclick="tog('angles')">각도 표시</button>
      <button class="toggle-btn on" id="btn-aux"    onclick="tog('aux')">보조선</button>
    </div>
  </div>

  <div class="card" style="width:100%;max-width:500px;margin:0 auto;">
    <div class="card-title">각도 조절</div>
    <div class="slider-item">
      <div class="slider-lbl">
        <span class="slider-name" style="color:var(--blue)">x (큰 각)</span>
        <span class="slider-num" id="vx">30°</span>
      </div>
      <input type="range" class="rx" id="slx" min="10" max="80" value="30" step="1">
    </div>
    <div class="slider-item">
      <div class="slider-lbl">
        <span class="slider-name" style="color:var(--orange)">y (작은 각)</span>
        <span class="slider-num" id="vy">15°</span>
      </div>
      <input type="range" class="ry" id="sly" min="1" max="29" value="15" step="1">
    </div>
  </div>
</div>

<footer>수학과제탐구 · 삼각함수의 덧셈정리 발견 활동</footer>

<script>
const cvs = document.getElementById('cvs');
const ctx  = cvs.getContext('2d');

// ─────────────────────────────────────────────────────
// 슬라이더값 dispX, dispY = 그림에서 실제로 보이는 각도
// 내부 계산용 angX = 90 - dispX + dispY,  angY = 90 - dispX
// → DE_len = sin(angX-angY) = sin(dispX-dispY) ... 아니라
//   angX - angY = (90-dispX+dispY) - (90-dispX) = dispY  ✓
//   90 - angX = dispX  ✓
// 즉:
//   AB_len = sin(angX)*cos(angY) = cos(dispX)*cos(dispY-dispX+90) ... 복잡
// 
// 더 직접적으로:
//   직사각형 변:
//     AB = sin(dispX)·cos(dispY)   (아래변)  ← AE 수평 성분
//     AD = cos(dispX)·cos(dispY) + sin(dispX)·sin(dispY) = cos(dispX-dispY)  (왼쪽변=높이)
//     DE = sin(dispX)·cos(dispY) - cos(dispX)·sin(dispY) = sin(dispX-dispY)  (위변 왼쪽, E까지)
//     EC = cos(dispX)·sin(dispY)  (위변 오른쪽)
//     BF = cos(dispX)·cos(dispY)  (오른쪽 아래, F까지)
//     FC = sin(dispX)·sin(dispY)  (오른쪽 위)
//
//   E는 DC 위: E = (DE_len, AD_len) → E = (sin(dispX-dispY), cos(dispX-dispY))
//   F는 CB 위: F = (AB_len, BF_len) → F = (sin(dispX)cos(dispY), cos(dispX)cos(dispY))
//
//   AE 방향각 = atan2(AD_len, DE_len) = atan2(cos(dispX-dispY), sin(dispX-dispY))
//             = 90 - (dispX-dispY)  ... 이게 dispX가 아님
//
// 결론: 이 직사각형에서 AE-AB 각 = 90-(dispX-dispY), AF-AB 각 = 90-dispX
// 슬라이더를 dispX, dispY로 쓰면 호가 직접 그 각도로 표시됨
// ─────────────────────────────────────────────────────

// dispX = 슬라이더 x값 (그림의 각 x), dispY = 슬라이더 y값 (그림의 각 y)
let dispX = 30, dispY = 15;

const opts = { labels:true, angles:true, aux:true };

function tog(k) {
  opts[k] = !opts[k];
  document.getElementById('btn-'+k).classList.toggle('on', opts[k]);
  draw();
}

const slx = document.getElementById('slx');
const sly = document.getElementById('sly');

function updSlider(el) {
  const p = ((el.value - el.min)/(el.max - el.min)*100).toFixed(1)+'%';
  el.style.setProperty('--pct', p);
}

slx.addEventListener('input', () => {
  dispX = +slx.value;
  if (dispY >= dispX) { dispY = dispX - 1; sly.value = dispY; }
  sly.max = dispX - 1;
  updSlider(slx); updSlider(sly);
  draw();
});
sly.addEventListener('input', () => { dispY = +sly.value; updSlider(sly); draw(); });
slx.value = dispX; sly.value = dispY; sly.max = dispX - 1;
updSlider(slx); updSlider(sly);

function draw() {
  const W = cvs.width, H = cvs.height;
  ctx.clearRect(0, 0, W, H);

  // 내부 계산용 각도: angX = 90-dispX+dispY, angY = 90-dispX
  const angX = 90 - dispY;
  const angY = dispX - dispY;
  const xr = angX * Math.PI / 180;
  const yr = angY * Math.PI / 180;
  const sx = Math.sin(xr), cx_ = Math.cos(xr);
  const sy = Math.sin(yr), cy_ = Math.cos(yr);

  // 변의 길이
  const AB_len = sx * cy_;             // sin(angX)cos(angY)
  const BC_len = cx_ * cy_ + sx * sy;  // cos(angX-angY) = cos(dispY)... 확인필요
  const DE_len = sx * cy_ - cx_ * sy;  // sin(angX-angY) = sin(dispY)
  const BF_len = cx_ * cy_;            // cos(angX)cos(angY)

  const margin = 62;
  const R = (Math.min(W, H) - margin * 2 - 40) / Math.max(AB_len, BC_len);

  const Ax = margin, Ay = H - margin - 10;
  const pt = (rx, ry) => [Ax + rx * R, Ay - ry * R];

  const A = pt(0,       0);
  const B = pt(AB_len,  0);
  const C = pt(AB_len,  BC_len);
  const D = pt(0,       BC_len);
  const E = pt(DE_len,  BC_len);  // DC 위
  const F = pt(AB_len,  BF_len);  // CB 위
  const G = pt(DE_len,  0);

  // 호: 실제 선분 AE, AF 방향을 atan2로 계산
  const aeAngle = Math.atan2(E[1] - A[1], E[0] - A[0]); // 음수(위쪽)
  const afAngle = Math.atan2(F[1] - A[1], F[0] - A[0]); // 음수(위쪽)

  // 배경
  ctx.fillStyle = 'rgba(200, 210, 230, 0.15)';
  ctx.fillRect(A[0], C[1], B[0] - A[0], A[1] - C[1]);

  // 보조선
  if (opts.aux) {
    ctx.setLineDash([5, 4]);
    ctx.strokeStyle = '#c0c0c0';
    ctx.lineWidth = 1.2;
    seg(E, G);
    ctx.setLineDash([]);
  }

  // 회색 변
  gSeg(A, D);
  gSeg(B, C);
  gSeg(A, E);
  gSeg(A, F);
  gSeg(E, F);

  // 핵심변
  keySeg(A, B, '#2563eb', 4); midTick(A, B, '#2563eb');
  keySeg(D, E, '#dc2626', 4); midTick(D, E, '#dc2626');
  keySeg(E, C, '#16a34a', 4); midTick(E, C, '#16a34a');

  // 직각 표시 at F
  const sz = 7;
  ctx.strokeStyle = '#9ca3af';
  ctx.lineWidth = 1.2;
  ctx.strokeRect(F[0] - sz, F[1] - sz, sz, sz);

  // 각도 호
  if (opts.angles) {
    // x 호: aeAngle → 0 (시계방향)
    ctx.strokeStyle = '#2563eb';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.arc(A[0], A[1], 42, aeAngle, 0);
    ctx.stroke();

    // y 호: afAngle → 0 (시계방향)
    ctx.strokeStyle = '#d97706';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.arc(A[0], A[1], 26, afAngle, 0);
    ctx.stroke();

    // 레이블
    ctx.font = 'bold 13px Noto Serif KR, serif';
    const xMid = aeAngle / 2;
    ctx.fillStyle = '#2563eb';
    ctx.fillText('x', A[0] + 56 * Math.cos(xMid) - 5, A[1] + 56 * Math.sin(xMid) + 4);
    const yMid = afAngle / 2;
    ctx.fillStyle = '#d97706';
    ctx.fillText('y', A[0] + 30 * Math.cos(yMid) - 4, A[1] + 30 * Math.sin(yMid) + 4);
  }

  // 점
  drawDot(A, '#374151', 5);
  drawDot(B, '#374151', 5);
  drawDot(C, '#374151', 5);
  drawDot(D, '#374151', 5);
  drawDot(E, '#374151', 5);
  drawDot(F, '#9ca3af', 4);
  drawDot(G, '#9ca3af', 4);

  // 점 이름
  if (opts.labels) {
    ctx.font = 'bold 13px Noto Serif KR, serif';
    label('A', A, '#374151', -15,  15);
    label('B', B, '#374151',   7,  15);
    label('C', C, '#374151',   7,  -6);
    label('D', D, '#374151', -15,  -6);
    label('E', E, '#374151',   3,  -8);
    label('F', F, '#9ca3af',   8,   4);
    label('G', G, '#9ca3af',   3,  15);
  }

  // AE 중간 "1" 레이블
  const midAE = [(A[0]+E[0])/2, (A[1]+E[1])/2];
  ctx.save();
  ctx.translate(midAE[0], midAE[1]);
  ctx.rotate(aeAngle);
  ctx.fillStyle = '#9ca3af';
  ctx.font = '11px JetBrains Mono, monospace';
  ctx.fillText('1', -4, -6);
  ctx.restore();

  // 슬라이더 표시
  document.getElementById('vx').textContent = dispX + '°';
  document.getElementById('vy').textContent = dispY + '°';
}

function seg(p1, p2) {
  ctx.beginPath(); ctx.moveTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]); ctx.stroke();
}
function gSeg(p1, p2) {
  ctx.strokeStyle = '#b0b7c3';
  ctx.lineWidth = 1.8;
  seg(p1, p2);
}
function keySeg(p1, p2, color, lw) {
  ctx.strokeStyle = color;
  ctx.lineWidth = lw;
  seg(p1, p2);
}
function drawDot(p, color, r) {
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(p[0],p[1],r,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'white'; ctx.lineWidth = 1.5; ctx.stroke();
}
function label(text, p, color, dx, dy) {
  ctx.fillStyle = color;
  ctx.fillText(text, p[0]+dx, p[1]+dy);
}
function midTick(p1, p2, color) {
  const mx=(p1[0]+p2[0])/2, my=(p1[1]+p2[1])/2;
  const ang = Math.atan2(p2[1]-p1[1], p2[0]-p1[0]) + Math.PI/2;
  ctx.strokeStyle = color; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(mx+8*Math.cos(ang), my+8*Math.sin(ang));
  ctx.lineTo(mx-8*Math.cos(ang), my-8*Math.sin(ang));
  ctx.stroke();
}

draw();
</script>
</body>
</html>

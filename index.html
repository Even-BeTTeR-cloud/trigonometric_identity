<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼각함수 덧셈정리 알아가기</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

  :root {
    --bg: #fafaf8;
    --panel: #ffffff;
    --border: #e0ddd6;
    --blue: #2563eb;
    --orange: #d97706;
    --red: #dc2626;
    --green: #16a34a;
    --gold: #b45309;
    --gray-line: #9ca3af;
    --text: #1a1a1a;
    --muted: #6b7280;
    --shadow: rgba(0,0,0,0.07);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Serif KR', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    padding: 14px 28px;
    background: var(--panel);
    border-bottom: 2px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    box-shadow: 0 1px 4px var(--shadow);
  }
  header h1 { font-size: 1.08rem; font-weight: 700; }
  .badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    background: #eff6ff;
    color: var(--blue);
    border: 1px solid #bfdbfe;
    border-radius: 4px;
    padding: 3px 9px;
  }

  .main {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 560px;
    padding: 20px 20px 0;
    align-items: center;
    gap: 16px;
  }

  .canvas-wrap {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  canvas {
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    display: block;
    max-width: 100%;
    box-shadow: 0 2px 12px var(--shadow);
  }

  .toggle-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .toggle-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: white;
    color: var(--muted);
    cursor: pointer;
    transition: all .2s;
  }
  .toggle-btn.on {
    border-color: var(--blue);
    background: #eff6ff;
    color: var(--blue);
  }

  .card {
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 15px;
    box-shadow: 0 1px 6px var(--shadow);
  }
  .card-title {
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.4px;
    color: var(--muted);
    margin-bottom: 11px;
  }

  .slider-item { display:flex; flex-direction:column; gap:6px; margin-bottom:11px; }
  .slider-item:last-child { margin-bottom:0; }
  .slider-lbl { display:flex; justify-content:space-between; align-items:center; }
  .slider-name { font-family:'JetBrains Mono',monospace; font-size:.88rem; font-weight:600; }
  .slider-num  { font-family:'JetBrains Mono',monospace; font-size:.75rem; color:var(--muted); }

  input[type=range] {
    width:100%; height:4px;
    -webkit-appearance:none; appearance:none;
    border-radius:2px; outline:none; cursor:pointer;
  }
  input[type=range].rx {
    background:linear-gradient(to right, var(--blue) 0%, var(--blue) var(--pct,50%), #dbeafe var(--pct,50%), #dbeafe 100%);
  }
  input[type=range].ry {
    background:linear-gradient(to right, var(--orange) 0%, var(--orange) var(--pct,50%), #fef3c7 var(--pct,50%), #fef3c7 100%);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:15px; height:15px;
    border-radius:50%; border:2px solid #fff; cursor:pointer;
    box-shadow:0 1px 4px rgba(0,0,0,0.2);
  }
  input[type=range].rx::-webkit-slider-thumb { background:var(--blue); }
  input[type=range].ry::-webkit-slider-thumb { background:var(--orange); }

  footer {
    width:100%; text-align:center;
    padding:16px; font-size:.65rem; color:var(--muted);
    margin-top:20px;
  }
</style>
</head>
<body>

<header>
  <h1>삼각함수 덧셈정리 알아가기</h1>
  <span class="badge">직각삼각형 구성 탐구</span>
</header>

<div class="main">
  <div class="canvas-wrap">
    <canvas id="cvs" width="500" height="520"></canvas>

    <div class="toggle-row">
      <button class="toggle-btn on" id="btn-labels" onclick="tog('labels')">점 이름</button>
      <button class="toggle-btn on" id="btn-angles" onclick="tog('angles')">각도 표시</button>
    </div>
  </div>

  <div class="card" style="width:100%;max-width:500px;margin:0 auto;">
    <div class="card-title">각도 조절</div>
    <div class="slider-item">
      <div class="slider-lbl">
        <span class="slider-name" style="color:var(--blue)">x = ∠FAD</span>
        <span class="slider-num" id="vx">40°</span>
      </div>
      <input type="range" class="rx" id="slx" min="15" max="75" value="40" step="1">
    </div>
    <div class="slider-item">
      <div class="slider-lbl">
        <span class="slider-name" style="color:var(--orange)">y = ∠FAE</span>
        <span class="slider-num" id="vy">20°</span>
      </div>
      <input type="range" class="ry" id="sly" min="1" max="39" value="20" step="1">
    </div>
  </div>
</div>

<footer>미적분 · 삼각함수의 덧셈정리 발견 활동</footer>

<script>
/*
  기하학적 설계:
  ─────────────────────────────────────────────────
  좌표계: A를 원점, 오른쪽=+x, 위쪽=+y (캔버스는 y 반전)

  - 직사각형 ABCD: A(좌하), B(우하), C(우상), D(좌상)
  - AD는 수직 방향(위쪽)

  각도 정의:
  - x = ∠FAD: A에서 수직선 AD로부터 AF까지의 각 (오른쪽으로)
  - y = ∠FAE: AF로부터 AE까지의 각 (오른쪽으로)
  - 따라서 ∠EAD = x + y (AD로부터 AE까지)
  - 단, y < x 이어야 함 (∠FAE < ∠FAD)

  AE = 1 (고정)
  AE 방향: AD에서 오른쪽으로 (x+y)만큼 회전
    → E_x = sin(x+y),  E_y = cos(x+y)

  AF 방향: AD에서 오른쪽으로 x만큼 회전
    → AF의 방향벡터: (sin x, cos x)

  E는 선분 CD 위 (y좌표 = AD_len)
  직사각형 높이 AD_len = E_y = cos(x+y)
  직사각형 너비 AB_len = ?

  F는 선분 CB 위 (x좌표 = AB_len)
  ∠EFA = 90° 조건:
    벡터 FE와 FA가 수직
    FE = E - F,  FA = A - F
    FE · FA = 0

  F는 AF 직선 위 & CB(x = AB_len) 위
  AF 직선: 점 A = (0,0), 방향 (sin x, cos x)
    F = t·(sin x, cos x)  → F_x = t·sin x,  F_y = t·cos x

  F가 CB 위: F_x = AB_len
    → t = AB_len / sin x
    → F_y = AB_len · cos x / sin x = AB_len / tan x

  ∠EFA = 90° 조건: FA·FE = 0
    FA = A - F = (-F_x, -F_y)
    FE = E - F = (E_x - F_x, E_y - F_y)

    (-F_x)(E_x - F_x) + (-F_y)(E_y - F_y) = 0
    -F_x·E_x + F_x² - F_y·E_y + F_y² = 0
    F_x² + F_y² = F_x·E_x + F_y·E_y
    |AF|² = F · E  (내적)

  F = (AB_len, AB_len/tan x) = AB_len · (1, 1/tan x)
  |AF|² = AB_len² · (1 + 1/tan²x) = AB_len² / sin²x

  F·E = AB_len · E_x + (AB_len/tan x) · E_y
       = AB_len · [sin(x+y) + cos x · cos(x+y) / sin x]
       = AB_len · [sin(x+y)·sin x + cos x · cos(x+y)] / sin x
       = AB_len · cos(x+y - x) / sin x   (코사인 차 공식)
       = AB_len · cos y / sin x

  ∴ AB_len² / sin²x = AB_len · cos y / sin x
     AB_len = sin x · cos y   ← 직사각형 너비

  최종 좌표 (AE=1 기준):
  - A = (0, 0)
  - B = (sin x · cos y, 0)
  - C = (sin x · cos y, cos(x+y))
  - D = (0, cos(x+y))
  - E = (sin(x+y), cos(x+y))   ← CD 위 (y좌표 = 높이 ✓)
  - F = (sin x · cos y, sin x · cos y / tan x) = (sin x · cos y, cos x · cos y)  ← CB 위 ✓

  검증:
  - E_x = sin(x+y), D_x = 0, C_x = sin x · cos y
    CD 위: 0 ≤ sin(x+y) ≤ sin x · cos y ?
    sin x·cos y ≥ sin(x+y) = sin x·cos y + cos x·sin y  →  0 ≥ cos x·sin y
    → 성립하려면 cos x·sin y ≤ 0 → x > 90° 필요... 문제!

  수정: E는 D쪽에서 C 방향이므로 D에서 오른쪽으로
  사실 ∠EAD = x+y이면 E_x = sin(x+y)이고
  C_x = AB_len = sin x · cos y
  sin(x+y) = sin x cos y + cos x sin y > sin x cos y (for x,y > 0)
  → E가 C 바깥으로 나감

  → ∠EAD = x - y 로 설정해야 E가 CD 안에 들어옴
  (∠FAD = x, ∠FAE = y이면 E는 F보다 왼쪽/아래, 즉 AD 쪽)

  재설계: ∠EAD = x - y (AF의 왼쪽)
  - AE 방향: AD에서 오른쪽으로 (x-y)만큼 → E = (sin(x-y), cos(x-y))
  - AF 방향: AD에서 오른쪽으로 x만큼
  - ∠FAE = y (AE와 AF 사이 = x - (x-y) = y ✓)
  - ∠FAD = x ✓
  - E_y = cos(x-y) → 이게 직사각형 높이 AD_len

  E는 CD 위: E_x가 0~AB_len 사이여야 함
    sin(x-y) ≤ AB_len = sin x · cos y ?
    sin(x-y) = sin x cos y - cos x sin y < sin x cos y ✓  (for x,y>0, x<90)

  F_y = cos x · cos y (위에서 유도한 대로)
    F_y ≤ AD_len = cos(x-y)?
    cos x cos y ≤ cos(x-y) = cos x cos y + sin x sin y ✓

  모든 조건 성립!
*/

const cvs = document.getElementById('cvs');
const ctx  = cvs.getContext('2d');

let angX = 40, angY = 20; // x = ∠FAD, y = ∠FAE

const opts = { labels:true, angles:true };

function tog(k) {
  opts[k] = !opts[k];
  document.getElementById('btn-'+k).classList.toggle('on', opts[k]);
  draw();
}

const slx = document.getElementById('slx');
const sly = document.getElementById('sly');

function updSlider(el) {
  const p = ((el.value - el.min)/(el.max - el.min)*100).toFixed(1)+'%';
  el.style.setProperty('--pct', p);
}

slx.addEventListener('input', () => {
  angX = +slx.value;
  if (angY >= angX) { angY = angX - 1; sly.value = angY; }
  sly.max = angX - 1;
  updSlider(slx); updSlider(sly);
  draw();
});
sly.addEventListener('input', () => {
  angY = +sly.value;
  updSlider(sly);
  draw();
});
slx.value = angX; sly.value = angY; sly.max = angX - 1;
updSlider(slx); updSlider(sly);

function draw() {
  const W = cvs.width, H = cvs.height;
  ctx.clearRect(0, 0, W, H);

  const x = angX * Math.PI / 180;  // ∠FAD
  const y = angY * Math.PI / 180;  // ∠FAE

  // AE = 1 기준 좌표 (수학 좌표계)
  // A = (0,0), B = (AB,0), C = (AB,h), D = (0,h)
  const AB = Math.sin(x) * Math.cos(y);   // 직사각형 너비
  const h  = Math.cos(x - y);             // 직사각형 높이 = cos(x-y) = AE의 y성분

  // 각 점 (수학 좌표)
  const Am = [0,   0 ];
  const Bm = [AB,  0 ];
  const Cm = [AB,  h ];
  const Dm = [0,   h ];
  const Em = [Math.sin(x - y), h];           // CD 위: y좌표=h, x좌표=sin(x-y)
  const Fm = [AB, Math.cos(x) * Math.cos(y)]; // CB 위: x좌표=AB, y좌표=cosX·cosY

  // 캔버스 변환: 여백 설정 후 스케일
  const pad = 64;
  const scale = (Math.min(W, H) - pad * 2) / Math.max(AB, h);

  // A를 좌하단에 배치
  const ox = pad;
  const oy = H - pad - 10;

  function toCanvas(p) {
    return [ox + p[0] * scale, oy - p[1] * scale];
  }

  const A = toCanvas(Am);
  const B = toCanvas(Bm);
  const C = toCanvas(Cm);
  const D = toCanvas(Dm);
  const E = toCanvas(Em);
  const F = toCanvas(Fm);

  // ── 배경 채우기 ──
  ctx.fillStyle = 'rgba(200, 210, 230, 0.12)';
  ctx.beginPath();
  ctx.moveTo(A[0], A[1]);
  ctx.lineTo(B[0], B[1]);
  ctx.lineTo(C[0], C[1]);
  ctx.lineTo(D[0], D[1]);
  ctx.closePath();
  ctx.fill();

  // ── 직사각형 변 ──
  ctx.strokeStyle = '#b0b7c3';
  ctx.lineWidth = 1.8;
  // AB (아래)
  seg(A, B);
  // BC (오른쪽)
  seg(B, C);
  // CD (위) - D~E, E~C 구분해서 그림
  // AD (왼쪽)
  seg(A, D);

  // DE (빨강), EC (초록)
  keySeg(D, E, '#dc2626', 3.5);
  keySeg(E, C, '#16a34a', 3.5);

  // ── AE, AF, EF ──
  ctx.strokeStyle = '#b0b7c3';
  ctx.lineWidth = 1.8;
  seg(A, E);
  seg(A, F);

  ctx.strokeStyle = '#6b7280';
  ctx.lineWidth = 1.6;
  seg(E, F);

  // ── AB 강조 (파랑) ──
  keySeg(A, B, '#2563eb', 3.5);

  // ── AE 길이 "1" 레이블 ──
  const aeAngle = Math.atan2(E[1] - A[1], E[0] - A[0]);
  const midAE = [(A[0]+E[0])/2, (A[1]+E[1])/2];
  ctx.save();
  ctx.translate(midAE[0], midAE[1]);
  ctx.rotate(aeAngle);
  ctx.fillStyle = '#555';
  ctx.font = 'bold 12px JetBrains Mono, monospace';
  ctx.fillText('1', -4, -7);
  ctx.restore();

  // ── F에서 직각 표시 (∠EFA = 90°) ──
  // EF 방향 단위벡터
  const efDx = E[0]-F[0], efDy = E[1]-F[1];
  const efLen = Math.hypot(efDx, efDy);
  const euF = [efDx/efLen, efDy/efLen]; // E→F 반대 (F→E 방향)

  // AF 방향 단위벡터 (A→F)
  const afDx = F[0]-A[0], afDy = F[1]-A[1];
  const afLen = Math.hypot(afDx, afDy);
  const uAF = [afDx/afLen, afDy/afLen]; // A→F 방향

  const sq = 9;
  const p1 = [F[0] + euF[0]*sq, F[1] + euF[1]*sq];
  const p2 = [F[0] + euF[0]*sq + uAF[0]*sq, F[1] + euF[1]*sq + uAF[1]*sq]; // 수정: uAF 방향
  const p3 = [F[0] + uAF[0]*sq, F[1] + uAF[1]*sq];

  // FE 방향 (F→E)
  const feUx = (E[0]-F[0])/efLen, feUy = (E[1]-F[1])/efLen;
  // FA 방향 (F→A)
  const faUx = (A[0]-F[0])/afLen, faUy = (A[1]-F[1])/afLen;

  const sq2 = 9;
  const r1 = [F[0] + feUx*sq2, F[1] + feUy*sq2];
  const r2 = [F[0] + feUx*sq2 + faUx*sq2, F[1] + feUy*sq2 + faUy*sq2];
  const r3 = [F[0] + faUx*sq2, F[1] + faUy*sq2];

  ctx.strokeStyle = '#6b7280';
  ctx.lineWidth = 1.3;
  ctx.beginPath();
  ctx.moveTo(r1[0], r1[1]);
  ctx.lineTo(r2[0], r2[1]);
  ctx.lineTo(r3[0], r3[1]);
  ctx.stroke();

  // ── 각도 호 표시 ──
  if (opts.angles) {
    // A에서 각도: AD방향 = 위쪽 = -π/2 (캔버스 기준)
    // AF 방향 (캔버스)
    const afAngleCanvas = Math.atan2(F[1]-A[1], F[0]-A[0]);
    // AE 방향 (캔버스)
    const aeAngleCanvas = Math.atan2(E[1]-A[1], E[0]-A[0]);
    // AD 방향 (캔버스) = 위쪽 = -π/2
    const adAngle = -Math.PI / 2;

    // x = ∠FAD: AD에서 AF까지 (캔버스에서 반시계 → 시계방향)
    // 캔버스에서 A기준: AD는 위(음y), AF는 오른쪽 위
    // arc(x, y, r, startAngle, endAngle, anticlockwise)
    // adAngle = -π/2 (위쪽), afAngleCanvas = 오른쪽위(음y, 양x) → 더 큰 각
    // x 호: adAngle → afAngleCanvas (시계방향 = false는 반시계, 캔버스y반전)
    // 캔버스에서 '위에서 오른쪽으로' = adAngle에서 afAngleCanvas로 시계방향
    // ctx.arc 기본(anticlockwise=false)는 시계방향

    ctx.lineWidth = 2;

    // x 호 (파랑): ∠FAD — AD에서 AF까지
    ctx.strokeStyle = '#2563eb';
    ctx.beginPath();
    ctx.arc(A[0], A[1], 48, adAngle, afAngleCanvas, false);
    ctx.stroke();

    // y 호 (주황): ∠EAF — AE에서 AF까지 (예각, 작은 쪽)
    // aeAngleCanvas < afAngleCanvas (캔버스 기준)
    // 시계방향(false)으로 aeAngleCanvas → afAngleCanvas = 예각 호
    ctx.strokeStyle = '#d97706';
    ctx.beginPath();
    ctx.arc(A[0], A[1], 30, aeAngleCanvas, afAngleCanvas, false);
    ctx.stroke();

    // 레이블 위치: 호의 중간각
    ctx.font = 'bold 14px Noto Serif KR, serif';

    // x 레이블: AD와 AF 사이 중간각
    const xMidAngle = (adAngle + afAngleCanvas) / 2;
    ctx.fillStyle = '#2563eb';
    ctx.fillText('x', A[0] + 62 * Math.cos(xMidAngle) - 5, A[1] + 62 * Math.sin(xMidAngle) + 5);

    // y 레이블: AF와 AE 사이 중간각
    const yMidAngle = (afAngleCanvas + aeAngleCanvas) / 2;
    ctx.fillStyle = '#d97706';
    ctx.fillText('y', A[0] + 40 * Math.cos(yMidAngle) - 4, A[1] + 40 * Math.sin(yMidAngle) + 4);
  }

  // ── 점 표시 ──
  drawDot(A, '#374151', 5);
  drawDot(B, '#374151', 5);
  drawDot(C, '#374151', 5);
  drawDot(D, '#374151', 5);
  drawDot(E, '#374151', 5);
  drawDot(F, '#374151', 5);

  // ── 점 이름 ──
  if (opts.labels) {
    ctx.font = 'bold 14px Noto Serif KR, serif';
    label('A', A, '#374151', -18,  16);
    label('B', B, '#374151',   8,  16);
    label('C', C, '#374151',   8,  -6);
    label('D', D, '#374151', -18,  -6);
    label('E', E, '#374151',   3, -10);
    label('F', F, '#374151',   9,   5);
  }

  // ── 슬라이더 수치 업데이트 ──
  document.getElementById('vx').textContent = angX + '°';
  document.getElementById('vy').textContent = angY + '°';
}

// ── 유틸 함수 ──
function seg(p1, p2) {
  ctx.beginPath(); ctx.moveTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]); ctx.stroke();
}
function keySeg(p1, p2, color, lw) {
  ctx.strokeStyle = color;
  ctx.lineWidth = lw;
  seg(p1, p2);
}
function drawDot(p, color, r) {
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(p[0],p[1],r,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'white'; ctx.lineWidth = 1.5; ctx.stroke();
}
function label(text, p, color, dx, dy) {
  ctx.fillStyle = color;
  ctx.fillText(text, p[0]+dx, p[1]+dy);
}

draw();
</script>
